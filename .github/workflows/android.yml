name: Build and publish Lumiday
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumiday-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare persistent signing identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMIDAY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing LUMIDAY_KEYSTORE_BASE64 secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumiday.keystore"
          chmod 600 "$RUNNER_TEMP/lumiday.keystore"
          echo "LUMIDAY_KEYSTORE_PATH=$RUNNER_TEMP/lumiday.keystore" >> "$GITHUB_ENV"
          echo "LUMIDAY_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleAndroidTest lintDebug
          if [ -n "${LUMIDAY_KEYSTORE_PATH:-}" ]; then ./gradlew assembleRelease; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Lumiday-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/lint-results-debug.html
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA" || exit 0
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Lumiday.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/Lumiday.apk
          cd release
          sha256sum Lumiday.apk > SHA256SUMS.txt
          cd ..
          TAG="build-$GITHUB_RUN_NUMBER"
          cat > release/notes.md <<NOTES
          Lumiday 最新自动构建，Android 16+。
          版本代码：$LUMIDAY_VERSION_CODE。提交：$GITHUB_SHA。
          沿用此前仓库 APK 的签名，可覆盖升级。更新前建议导出本地备份。
          固定下载：https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Lumiday.apk
          微信若拦截 APK，请在右上角选择“在浏览器打开”。
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Lumiday.apk release/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --latest --notes-file release/notes.md
          else
            gh release create "$TAG" release/Lumiday.apk release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Lumiday · build $GITHUB_RUN_NUMBER" --notes-file release/notes.md --latest
          fi
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/lumiday.keystore"

  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew assembleDebug assembleAndroidTest lintDebug
