plugins { id 'com.android.application' }
android {
 namespace 'com.lumiday.app'
 compileSdk 36
 defaultConfig { applicationId 'com.lumiday.app'; minSdk 36; targetSdk 36; versionCode = (System.getenv('LUMIDAY_VERSION_CODE') ?: '7').toInteger(); versionName '2.5.0'; testInstrumentationRunner 'com.lumiday.app.SmokeInstrumentation' }
 signingConfigs {
   automated {
     if (System.getenv('LUMIDAY_KEYSTORE_PATH')) {
       storeFile file(System.getenv('LUMIDAY_KEYSTORE_PATH'))
       storePassword 'android'
       keyAlias 'androiddebugkey'
       keyPassword 'android'
     }
   }
 }
 buildTypes {
   release {
     if (System.getenv('LUMIDAY_KEYSTORE_PATH')) signingConfig signingConfigs.automated
     minifyEnabled false
   }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
